name: Build Angel Live Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Angel Live APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Remove stale Capacitor configs
        run: |
          rm -f capacitor.config.ts capacitor.config.js
          find . -name "capacitor.config.ts" -delete
          find . -name "capacitor.config.js" -delete
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Ensure Capacitor packages
        run: |
          npm install @capacitor/core@6.2.1 @capacitor/app@6.0.2 @capacitor/browser@6.0.4 --legacy-peer-deps
          npm install --save-dev @capacitor/cli@6.2.1 @capacitor/android@6.2.1 @capacitor/assets@3.0.5 typescript@5.7.2 --legacy-peer-deps
      - name: Create dist for Capacitor
        run: |
          rm -rf dist
          mkdir -p dist
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
          <body><script>location.replace("https://app.angellive.soulverseapps.com/");</script></body>
          </html>
          EOF
      - name: Verify web files
        run: |
          test -f capacitor.config.json
          test -d dist
          test -f dist/index.html
          cat capacitor.config.json
      - name: Add Android platform
        run: npx cap add android
      - name: Generate Angel Live assets
        run: |
          if [ -f resources/icon.png ]; then
            npx capacitor-assets generate
          else
            echo "No resources/icon.png; using default Android assets."
          fi
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure Android WebView popup authentication
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/angel/live
          cat > android/app/src/main/java/com/angel/live/MainActivity.java <<'JAVA'
          package com.angel.live;

          import android.app.Dialog;
          import android.os.Bundle;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private Dialog authDialog;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView main = getBridge().getWebView();
                  configureWebView(main);
                  main.getSettings().setSupportMultipleWindows(true);
                  main.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog,
                                                     boolean isUserGesture,
                                                     android.os.Message resultMsg) {
                          openAuthPopup(resultMsg);
                          return true;
                      }
                  });
              }

              private void configureWebView(WebView webView) {
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(true);
                  settings.setSupportMultipleWindows(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  CookieManager.getInstance().setAcceptCookie(true);
                  CookieManager.getInstance().setAcceptThirdPartyCookies(webView, true);
              }

              private void openAuthPopup(android.os.Message resultMsg) {
                  WebView popup = new WebView(this);
                  configureWebView(popup);

                  popup.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          // Keep OAuth/authorization navigation inside the popup so
                          // window.opener/postMessage can return to Angel Live.
                          return false;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                      }
                  });

                  popup.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onCloseWindow(WebView window) {
                          if (authDialog != null && authDialog.isShowing()) {
                              authDialog.dismiss();
                          }
                          window.destroy();
                      }

                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog,
                                                     boolean isUserGesture,
                                                     android.os.Message nestedResultMsg) {
                          // Avoid a second-level popup escaping to the system browser.
                          WebView nested = new WebView(AngelLiveMainActivityHolder.get());
                          return false;
                      }
                  });

                  CookieManager.getInstance().setAcceptThirdPartyCookies(popup, true);

                  authDialog = new Dialog(this);
                  authDialog.setTitle("Angel Live Sign In");
                  authDialog.setContentView(popup, new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));
                  authDialog.setOnDismissListener(d -> {
                      try { popup.destroy(); } catch (Exception ignored) {}
                  });
                  authDialog.show();

                  WebView.WebViewTransport transport =
                          (WebView.WebViewTransport) resultMsg.obj;
                  transport.setWebView(popup);
                  resultMsg.sendToTarget();
              }

              // Holder only exists to keep the generated source simple; nested popups
              // are not opened by the authentication flow.
              private static final class AngelLiveMainActivityHolder {
                  private static MainActivity instance;
                  static MainActivity get() { return instance; }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  AngelLiveMainActivityHolder.instance = this;
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  AngelLiveMainActivityHolder.instance = this;
              }
          }
          JAVA

      - name: Fix Android activity source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/java/com/angel/live/MainActivity.java")
          s=p.read_text()
          # Remove the unused nested-popup holder branch; returning false lets the
          # existing popup handle the OAuth flow without another window.
          s=s.replace('''                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog,
                                                     boolean isUserGesture,
                                                     android.os.Message nestedResultMsg) {
                          // Avoid a second-level popup escaping to the system browser.
                          WebView nested = new WebView(AngelLiveMainActivityHolder.get());
                          return false;
                      }

''','')
          s=s.replace('''              // Holder only exists to keep the generated source simple; nested popups
              // are not opened by the authentication flow.
              private static final class AngelLiveMainActivityHolder {
                  private static MainActivity instance;
                  static MainActivity get() { return instance; }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  AngelLiveMainActivityHolder.instance = this;
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  AngelLiveMainActivityHolder.instance = this;
              }
''','')
          p.write_text(s)
          PY

      - name: Add Android permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST" || sed -i '/<manifest /a <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          grep -q 'android.permission.CAMERA' "$MANIFEST" || sed -i '/<manifest /a <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST" || sed -i '/<manifest /a <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Angel-Live-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
