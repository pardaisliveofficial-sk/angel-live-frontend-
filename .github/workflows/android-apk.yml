name: Build Angel Live APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Install dependencies
        run: npm install


      - name: Install Capacitor Android
        run: |
          
npm install @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1 --legacy-peer-deps
      - name: Build Web App
        run: npm run build


      - name: Initialize Capacitor
        run: |
          npx cap init "Angel Live" "com.angel.live" --web-dir dist || true


      - name: Add Android Platform
        run: |
          npx cap add android || true


      - name: Sync Capacitor
        run: |
          npx cap sync android


      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Angel-Live-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
