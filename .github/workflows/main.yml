name: Build Angel Live Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Angel Live APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Remove stale native project
        run: rm -rf android

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Configure Android app
        shell: bash
        run: |
          set -e
          APP_GRADLE=android/app/build.gradle
          if ! grep -q "androidx.browser:browser" "$APP_GRADLE"; then
            sed -i '/dependencies {/a\    implementation "androidx.browser:browser:1.8.0"' "$APP_GRADLE"
          fi
          mkdir -p android/app/src/main/java/com/soulverseapps/angellive
          cat > android/app/src/main/java/com/soulverseapps/angellive/MainActivity.java <<'JAVA'
          package com.soulverseapps.angellive;

          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import androidx.browser.customtabs.CustomTabsIntent;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static final String ANGEL_URL = "https://app.angellive.soulverseapps.com/";
              private boolean openedBrowser = false;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  openAngelLive();
              }

              private void openAngelLive() {
                  if (openedBrowser) return;
                  openedBrowser = true;
                  try {
                      CustomTabsIntent intent = new CustomTabsIntent.Builder().build();
                      intent.intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      intent.launchUrl(this, Uri.parse(ANGEL_URL));
                  } catch (Exception e) {
                      Intent fallback = new Intent(Intent.ACTION_VIEW, Uri.parse(ANGEL_URL));
                      startActivity(fallback);
                  }
              }
          }
          JAVA

          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$MANIFEST" || sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          grep -q 'android.permission.CAMERA' "$MANIFEST" || sed -i '/<manifest /a\    <uses-permission android:name="android.permission.CAMERA" />' "$MANIFEST"
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST" || sed -i '/<manifest /a\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"

      - name: Generate Angel Live icons and splash
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Angel-Live-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
