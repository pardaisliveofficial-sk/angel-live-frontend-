name: Build Angel Live APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Angel Live Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build web
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install --save-dev @capacitor/cli@6.2.0 --legacy-peer-deps --no-audit --no-fund

      - name: Ensure Capacitor config
        shell: bash
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.angellive.app',
            appName: 'Angel Live',
            webDir: 'dist',
            bundledWebRuntime: false,
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF

      - name: Reset Android project
        shell: bash
        run: |
          rm -rf android
          npx cap add android

      - name: Add Firebase config
        shell: bash
        run: |
          test -f google-services.json
          cp google-services.json android/app/google-services.json

      - name: Configure Google Services
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/build.gradle")
          s = p.read_text()

          if "com.google.gms:google-services" not in s:
              marker = "dependencies {"
              s = s.replace(
                  marker,
                  marker + "\n        classpath 'com.google.gms:google-services:4.4.2'",
                  1
              )

          p.write_text(s)

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "com.google.gms.google-services" not in s:
              s += "\napply plugin: 'com.google.gms.google-services'\n"

          p.write_text(s)
          PY

      # IMPORTANT:
      # Firebase Auth 24.x requires Android minSdk 23.
      # Force EVERY Android Gradle file to use minSdk 23.
      - name: Force Android minSdk 23
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path("android/variables.gradle"),
              Path("android/app/build.gradle"),
              Path("android/build.gradle"),
          ]

          for p in files:
              if not p.exists():
                  continue

              s = p.read_text()

              # minSdkVersion = 22
              s = re.sub(
                  r"minSdkVersion\s*=\s*\d+",
                  "minSdkVersion = 23",
                  s
              )

              # minSdkVersion 22
              s = re.sub(
                  r"minSdkVersion\s+\d+",
                  "minSdkVersion 23",
                  s
              )

              # minSdk 22
              s = re.sub(
                  r"minSdk\s*=\s*\d+",
                  "minSdk = 23",
                  s
              )

              p.write_text(s)

          # Make absolutely sure variables.gradle contains minSdk 23
          p = Path("android/variables.gradle")

          if p.exists():
              s = p.read_text()

              if "minSdkVersion = 23" not in s:
                  if "ext {" in s:
                      s = s.replace(
                          "ext {",
                          "ext {\n    minSdkVersion = 23",
                          1
                      )
                  else:
                      s += "\next.minSdkVersion = 23\n"

              p.write_text(s)

          # Make sure app module explicitly uses 23
          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "minSdkVersion 23" not in s:
              s = s.replace(
                  "defaultConfig {",
                  "defaultConfig {\n        minSdkVersion 23",
                  1
              )

          p.write_text(s)
          PY

          echo "===== variables.gradle ====="
          grep -n "minSdk" android/variables.gradle || true

          echo "===== app/build.gradle ====="
          grep -n "minSdk" android/app/build.gradle || true

      - name: Add Firebase and Google Sign-In dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          s = p.read_text()

          if "play-services-auth" not in s:
              marker = "dependencies {"

              deps = """dependencies {
              implementation 'com.google.android.gms:play-services-auth:21.3.0'
              implementation 'com.google.firebase:firebase-auth:24.0.1'
          """

              s = s.replace(marker, deps, 1)

          p.write_text(s)
          PY

      - name: Install native Google auth bridge
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/angellive/app

          cat > android/app/src/main/java/com/angellive/app/GoogleAuthBridge.java <<'JAVA'
          package com.angellive.app;

          import android.app.Activity;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;

          import com.google.android.gms.auth.api.signin.GoogleSignIn;
          import com.google.android.gms.auth.api.signin.GoogleSignInAccount;
          import com.google.android.gms.auth.api.signin.GoogleSignInClient;
          import com.google.android.gms.auth.api.signin.GoogleSignInOptions;
          import com.google.android.gms.common.api.ApiException;
          import com.google.android.gms.tasks.Tasks;

          import com.google.firebase.auth.AuthCredential;
          import com.google.firebase.auth.FirebaseAuth;
          import com.google.firebase.auth.GoogleAuthProvider;

          import java.util.concurrent.Executors;

          import org.json.JSONObject;

          public final class GoogleAuthBridge {

            private final Activity activity;
            private final WebView webView;
            private final GoogleSignInClient client;
            private final FirebaseAuth firebase;

            public GoogleAuthBridge(Activity a, WebView w) {
              activity = a;
              webView = w;
              firebase = FirebaseAuth.getInstance();

              GoogleSignInOptions options =
                  new GoogleSignInOptions.Builder(
                      GoogleSignInOptions.DEFAULT_SIGN_IN
                  )
                  .requestIdToken(
                      a.getString(
                          com.angellive.app.R.string.default_web_client_id
                      )
                  )
                  .requestEmail()
                  .build();

              client = GoogleSignIn.getClient(a, options);
            }

            @JavascriptInterface
            public void signIn(final String callbackId) {
              activity.runOnUiThread(() -> {
                activity.startActivityForResult(
                    client.getSignInIntent(),
                    9001
                );

                webView.setTag(callbackId);
              });
            }

            public void handleResult(
                int requestCode,
                int resultCode,
                android.content.Intent data
            ) {
              if (requestCode != 9001) {
                return;
              }

              final Object tag = webView.getTag();
              final String callbackId =
                  tag == null ? "" : tag.toString();

              Executors.newSingleThreadExecutor().execute(() -> {
                try {
                  GoogleSignInAccount account =
                      GoogleSignIn
                          .getSignedInAccountFromIntent(data)
                          .getResult(ApiException.class);

                  AuthCredential credential =
                      GoogleAuthProvider.getCredential(
                          account.getIdToken(),
                          null
                      );

                  Tasks.await(
                      firebase.signInWithCredential(credential)
                  );

                  String token =
                      Tasks.await(
                          firebase.getCurrentUser().getIdToken(true)
                      ).getToken();

                  JSONObject user = new JSONObject();

                  user.put(
                      "userId",
                      firebase.getCurrentUser().getUid()
                  );

                  user.put(
                      "email",
                      account.getEmail() == null
                          ? ""
                          : account.getEmail()
                  );

                  user.put(
                      "name",
                      account.getDisplayName() == null
                          ? ""
                          : account.getDisplayName()
                  );

                  user.put(
                      "picture",
                      account.getPhotoUrl() == null
                          ? ""
                          : account.getPhotoUrl().toString()
                  );

                  JSONObject output = new JSONObject();

                  output.put("callbackId", callbackId);
                  output.put("ok", true);
                  output.put("accessToken", token);
                  output.put("user", user);

                  finish(output.toString());

                } catch (Exception e) {

                  try {
                    JSONObject output = new JSONObject();

                    output.put("callbackId", callbackId);
                    output.put("ok", false);

                    output.put(
                        "error",
                        e.getMessage() == null
                            ? "Google authentication failed"
                            : e.getMessage()
                    );

                    finish(output.toString());

                  } catch (Exception ignored) {
                  }
                }
              });
            }

            private void finish(String json) {

              final String encoded =
                  android.util.Base64.encodeToString(
                      json.getBytes(
                          java.nio.charset.StandardCharsets.UTF_8
                      ),
                      android.util.Base64.NO_WRAP
                  );

              activity.runOnUiThread(() ->
                  webView.evaluateJavascript(
                      "window.__angelNativeGoogleAuth && " +
                      "window.__angelNativeGoogleAuth('" +
                      encoded +
                      "')",
                      null
                  )
              );
            }
          }
          JAVA

      - name: Patch MainActivity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "android/app/src/main/java/com/angellive/app/MainActivity.java"
          )

          if not p.exists():
              raise SystemExit("MainActivity.java not found")

          s = p.read_text()

          if "GoogleAuthBridge" not in s:

              s = s.replace(
                  "import android.os.Bundle;",
                  "import android.os.Bundle;\n"
                  "import android.content.Intent;\n"
                  "import android.webkit.WebView;"
              )

              s = s.replace(
                  "public class MainActivity extends BridgeActivity {",
                  """public class MainActivity extends BridgeActivity {
              private GoogleAuthBridge googleAuthBridge;"""
              )

              s = s.replace(
                  "super.onCreate(savedInstanceState);",
                  """super.onCreate(savedInstanceState);

                  WebView w = getBridge().getWebView();

                  googleAuthBridge =
                      new GoogleAuthBridge(this, w);

                  w.addJavascriptInterface(
                      googleAuthBridge,
                      "AndroidGoogleAuth"
                  );""",
                  1
              )

              s = s.replace(
                  "\n}",
                  """
                  @Override
                  protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data
                  ) {
                      super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                      );

                      if (googleAuthBridge != null) {
                          googleAuthBridge.handleResult(
                              requestCode,
                              resultCode,
                              data
                          );
                      }
                  }
              }
              """,
                  1
              )

              p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      # Verify AFTER Capacitor sync so Firebase cannot see minSdk 22.
      - name: Verify Android minSdk
        shell: bash
        run: |
          echo "===== FINAL minSdk CHECK ====="

          grep -RIn \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            "minSdkVersion\|minSdk" \
            android | head -50

          if grep -RIn \
            --include="*.gradle" \
            --include="*.gradle.kts" \
            "minSdkVersion[[:space:]]*=[[:space:]]*22\|minSdkVersion[[:space:]]\+22\|minSdk[[:space:]]*=[[:space:]]*22" \
            android; then

            echo "ERROR: minSdk 22 still exists!"
            exit 1
          fi

          echo "minSdk 22 not found."

      - name: Verify web assets
        run: test -f dist/index.html

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Angel-Live-Firebase-Google-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
