name: Build Angel Live APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Angel Live APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17


      - name: Install project dependencies
        run: |
          npm install --legacy-peer-deps


      - name: Install TypeScript
        run: |
          npm install --save-dev typescript@5.7.3 --legacy-peer-deps


      - name: Install Capacitor
        run: |
          npm install \
            @capacitor/core@6.2.1 \
            @capacitor/cli@6.2.1 \
            @capacitor/android@6.2.1 \
            --legacy-peer-deps


      - name: Build Web App
        run: |
          npm run build


      - name: Create Capacitor Config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.angel.live',
            appName: 'Angel Live',
            webDir: 'dist',
            bundledWebRuntime: false,
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF


      - name: Remove old Android project
        run: |
          rm -rf android


      - name: Add Android Platform
        run: |
          npx cap add android


      - name: Sync Capacitor
        run: |
          npx cap sync android


      - name: Configure Android Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
          ]

          marker = '<application'

          if marker in text:
              missing = [
                  p for p in permissions
                  if p not in text
              ]

              if missing:
                  text = text.replace(
                      marker,
                      '\n'.join(missing) + '\n    ' + marker,
                      1
                  )

          path.write_text(text)
          PY


      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Angel-Live-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
