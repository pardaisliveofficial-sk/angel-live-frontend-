name: Build Angel Live APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Angel Live APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Install TypeScript explicitly
        run: npm install --save-dev typescript@5.7.3

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1 --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.angel.live',
            appName: 'Angel Live',
            webDir: 'dist',
            bundledWebRuntime: false,
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF

      - name: Remove stale Android project
        run: rm -rf android

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Configure Android
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  "<manifest",
                  '<manifest\\n    xmlns:android="http://schemas.android.com/apk/res/android"',
                  1
              )

          if "android.permission.CAMERA" not in s:
              s = s.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.INTERNET" />\\n'
                  '    <uses-permission android:name="android.permission.CAMERA" />\\n'
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\\n'
                  '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\\n'
                  '    <application',
                  1
              )

          p.write_text(s)
          PY

      - name: Generate Angel Live assets
        run: npx capacitor-assets generate

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Angel-Live-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
